server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy to the Flask API — mirrors the Vite dev server proxy.
    # Keeping browser requests same-origin means JWT cookies and CSRF
    # double-submit work exactly like local development.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI + OpenAPI spec passthrough
    location ~ ^/(openapi\.json|swagger-ui) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
