[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.2",
    "flask>=3.1.2",
    "flask-caching>=2.3.1",
    "flask-cors>=6.0.2",
    "flask-jwt-extended>=4.7.1",
    "flask-smorest>=0.46.2",
    "flask-sqlalchemy>=3.1.1",
    "httpx>=0.28.1",
    "marshmallow-sqlalchemy>=1.4.2",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
